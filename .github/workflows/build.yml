name: Build dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install THEOS and deps
        run: |
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build dylib (Theos, thin arm64)
        run: |
          export THEOS=$HOME/theos
          make FINALPACKAGE=1
          mkdir -p out
          find .theos \( -name '*.dSYM' -o -path '*/dSYM/*' \) -prune -o -name '*.dylib' -exec cp {} out/ \;
          file out/*.dylib
          ls -la out/

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: RivoVPNAD-dylib
          path: out/*.dylib
          if-no-files-found: error