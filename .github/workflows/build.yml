name: Build RivoVPNAD

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install theos
        run: |
          sudo mkdir -p /opt/theos
          sudo chown "$USER" /opt/theos
          git clone --recursive https://github.com/theos/theos.git /opt/theos

      - name: Install ldid
        run: |
          brew install ldid || brew install ldid-procursus

      - name: Build dylib
        env:
          THEOS: /opt/theos
          THEOS_PACKAGE_SCHEME: rootless
        run: |
          make clean

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RivoVPNAD-dylib
          path: |
            .theos/obj/debug/arm64/RivoVPNAD.dylib
